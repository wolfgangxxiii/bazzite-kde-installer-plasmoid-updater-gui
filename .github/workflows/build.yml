name: Build GTK4 AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GTK4 and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            librsvg2-bin libglib2.0-bin curl file patchelf desktop-file-utils \
            libfuse2t64 xvfb xauth
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --locked
      - name: Build AppImage
        run: bash scripts/build-appimage.sh
      - name: Smoke test AppImage under Xvfb
        run: |
          set +e
          timeout 12s env APPIMAGE_EXTRACT_AND_RUN=1 GDK_BACKEND=x11 \
            xvfb-run -a ./dist/Bazzite-Plasmoid-Updater-GUI-x86_64.AppImage \
            > appimage-smoke.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat appimage-smoke.log
            echo "AppImage closed before the 12-second GUI smoke test window (exit $exit_code)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bazzite-plasmoid-updater-gui-appimage
          path: dist/*.AppImage
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.AppImage --generate-notes --verify-tag
          fi
    permissions:
      contents: write
