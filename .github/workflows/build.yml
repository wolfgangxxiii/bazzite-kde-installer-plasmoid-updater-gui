name: Build GTK4 AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GTK4 and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            librsvg2-bin libglib2.0-bin curl file patchelf desktop-file-utils \
            libfuse2t64 xvfb xauth
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --locked
      - name: Test standalone background agent
        run: |
          cargo build --locked --release --bins
          ./target/release/bazzite-plasmoid-updater-agent --version | grep -F 'bazzite-plasmoid-updater-agent 0.2.0'
      - name: Build AppImage
        run: bash scripts/build-appimage.sh
      - name: Smoke test AppImage under Xvfb
        run: |
          set +e
          timeout 12s env APPIMAGE_EXTRACT_AND_RUN=1 GDK_BACKEND=x11 \
            xvfb-run -a ./dist/Bazzite-Plasmoid-Updater-GUI-x86_64.AppImage \
            > appimage-smoke.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat appimage-smoke.log
            echo "AppImage closed before the 12-second GUI smoke test window (exit $exit_code)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bazzite-plasmoid-updater-gui-appimage
          path: dist/*.AppImage
          if-no-files-found: error
      - name: Publish AppImage in GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Publish a new stable download after the first successful build.
            # Future pushes do not silently replace an already published release.
            if gh release view v0.2.0 >/dev/null 2>&1; then
              echo "v0.2.0 already published; use a new version tag for another release."
            else
              gh release create v0.2.0 dist/*.AppImage \
                --target "$GITHUB_SHA" \
                --title "Bazzite Plasmoid Updater GUI v0.2.0" \
                --notes "Automatyczne aktualizacje w tle przez samodzielnego agenta systemd --user: aktualizuje dodatki KDE Store oraz samą binarkę plasmoid-updater z GitHub (kontrola SHA-256). Harmonogram 6/12/24 h, przełącznik aktualizacji narzędzia oraz naprawa brakującego bsdtar przez Homebrew."
            fi
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.AppImage --generate-notes --verify-tag
          fi
    permissions:
      contents: write
