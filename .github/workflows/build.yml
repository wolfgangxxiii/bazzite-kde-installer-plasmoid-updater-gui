name: Build GTK4 AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GTK4 and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            librsvg2-bin libglib2.0-bin curl file patchelf desktop-file-utils \
            libfuse2t64 xvfb xauth xdotool scrot
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate Bazzite host-test script
        run: |
          bash -n scripts/verify-bazzite.sh scripts/smoke-ui.sh
          sh -n packaging/gtk4-env.sh
          bash scripts/test-cursor-theme.sh
      - name: Run unit tests
        run: cargo test --locked
      - name: Test standalone background agent
        run: |
          cargo build --locked --release --bins
          ./target/release/plasmoid-updater-agent --version | grep -F 'plasmoid-updater-agent 0.5.11'
      - name: Build AppImage
        run: bash scripts/build-appimage.sh
      - name: Smoke test AppImage under Xvfb
        run: |
          set +e
          timeout 12s env APPIMAGE_EXTRACT_AND_RUN=1 GDK_BACKEND=x11 \
            xvfb-run -a ./dist/Bazzite-Plasmoid-Updater-GUI-x86_64.AppImage \
            > appimage-smoke.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat appimage-smoke.log
            echo "AppImage closed before the 12-second GUI smoke test window (exit $exit_code)."
            exit 1
          fi
      - name: Smoke test English interface under Xvfb
        run: |
          smoke_config="$(mktemp -d)"
          mkdir -p "$smoke_config/bazzite-plasmoid-updater-gui"
          printf 'en\n' > "$smoke_config/bazzite-plasmoid-updater-gui/language"
          set +e
          timeout 8s env XDG_CONFIG_HOME="$smoke_config" G_DEBUG=fatal-criticals \
            APPIMAGE_EXTRACT_AND_RUN=1 GDK_BACKEND=x11 \
            xvfb-run -a ./dist/Bazzite-Plasmoid-Updater-GUI-x86_64.AppImage \
            > english-smoke.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            cat english-smoke.log
            echo "English GUI did not remain open for the smoke test (exit $exit_code)."
            exit 1
          fi
      - name: Exercise responsive layouts and capture screenshots
        run: xvfb-run -a -s '-screen 0 1440x900x24' bash scripts/smoke-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-layout-screenshots
          path: ui-smoke/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bazzite-plasmoid-updater-gui-appimage
          path: dist/*.AppImage
          if-no-files-found: error
      - name: Publish AppImage in GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Publish a new stable download after the first successful build.
            # Future pushes do not silently replace an already published release.
            if gh release view v0.5.11 >/dev/null 2>&1; then
              echo "v0.5.11 already published; use a new version tag for another release."
            else
              gh release create v0.5.11 dist/*.AppImage \
                --target "$GITHUB_SHA" \
                --title "Bazzite Plasmoid Updater GUI v0.5.11" \
                --notes "Nowe nagłówki, czytelna lista diagnostyki z kolorami statusu, przycisk projektu źródłowego i akcent przycisków odczytywany z aktualnego motywu KDE Plasma."
            fi
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.AppImage --generate-notes --verify-tag
          fi
    permissions:
      contents: write
