name: Remove old releases (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-archived-releases.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep v1.0.0 and remove 18 old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx 'Bazzite-Plasmoid-Updater-GUI-v1.0.0-x86_64.AppImage'
          old_tags=(
            v0.1.0 v0.2.0 v0.3.0 v0.3.1 v0.4.0
            v0.5.0 v0.5.1 v0.5.2 v0.5.3 v0.5.4
            v0.5.5 v0.5.6 v0.5.7 v0.5.8 v0.5.9
            v0.5.10 v0.5.11 v0.5.12
          )
          for tag in "${old_tags[@]}"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
