[package]
name = "bazzite-plasmoid-updater-gui"
version = "1.0.2"
edition = "2021"
description = "A native GTK4/libadwaita installer and update scheduler for plasmoid-updater on Bazzite"
license = "GPL-3.0-or-later"
repository = "https://github.com/wolfgangxxiii/bazzite-kde-installer-plasmoid-updater-gui"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "0.9"
toml_edit = "0.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
